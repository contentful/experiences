<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contentful Experiences – Web SDK</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/theme.css" />
    <script data-env-placeholder></script>
    <script src="/dist/contentful-experiences-web.umd.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <nav class="app-nav" id="app-nav" aria-label="Main navigation">
        <a href="/" data-testid="link-home">Home</a>
        <a href="/page-two" data-testid="link-page-two">Page Two</a>
      </nav>
      <div class="app-body">
        <aside class="app-sidebar" aria-label="Tracking">
          <section class="tracking-log" data-testid="analytics-events-container">
            <div class="tracking-log__header">
              <h2>Tracking</h2>
              <span class="tracking-log__badge">
                <span data-testid="raw-events-count" id="raw-events-count">0</span> attempts
              </span>
            </div>
            <p class="tracking-log__empty" data-testid="no-events-message" id="no-events-message">
              Tracking is not connected yet.
            </p>
          </section>
        </aside>
        <main class="app-main" id="app-main" tabindex="-1"></main>
      </div>
    </div>

    <template id="tpl-utilities">
      <section class="control-panel" aria-label="Utilities">
        <h2 class="control-panel__title">Utilities</h2>
        <div class="control-panel__fields">
          <span class="control-panel__row-label">Event consent</span>
          <span class="control-panel__row-value" data-testid="consent-status">Not connected</span>
          <span>
            <button class="btn btn--sm btn--secondary" data-testid="consent-button" disabled>
              Grant
            </button>
            <button class="btn btn--sm btn--secondary" data-testid="unconsent-button" disabled>
              Revoke
            </button>
          </span>
          <span class="control-panel__row-label">Persistence consent</span>
          <span class="control-panel__row-value" data-testid="persistence-consent-status">
            Not connected
          </span>
          <span></span>
          <span class="control-panel__row-label">Identify requested</span>
          <span class="control-panel__row-value" data-testid="identified-status"
            >Not connected</span
          >
          <span>
            <button class="btn btn--sm btn--secondary" data-testid="identify-button" disabled>
              Identify
            </button>
            <button class="btn btn--sm btn--danger" data-testid="reset-button" disabled>
              Reset
            </button>
          </span>
        </div>
        <p class="control-panel__note">Visitor controls are unavailable in this foundation.</p>
      </section>
    </template>

    <template id="tpl-home">
      <div class="page-header" data-testid="home-view">
        <h1>Web SDK – Vanilla JS</h1>
        <p class="page-header__subtitle">Reference implementation of @contentful/experiences-web</p>
      </div>
      <div data-utilities></div>
      <section class="page-section" data-testid="readiness-experience-section">
        <header class="page-section__header">
          <h2>Content readiness</h2>
          <p>Experience content will appear here once fetching and rendering are connected.</p>
        </header>
        <div class="placeholder-card" data-testid="readiness-experience-placeholder">
          Application foundation ready. No content requested.
        </div>
      </section>
      <div class="sections-grid sections-grid--split">
        <section class="page-section">
          <header class="page-section__header"><h2>Automatically tracked Experiences</h2></header>
          <div class="entry-grid" id="auto-observed">
            <p class="placeholder-card">Experience content is not connected yet.</p>
          </div>
        </section>
        <section class="page-section">
          <header class="page-section__header"><h2>Manual events</h2></header>
          <div class="entry-grid" id="manually-observed">
            <p class="placeholder-card">Manual event examples are not connected yet.</p>
          </div>
        </section>
      </div>
    </template>

    <template id="tpl-page-two">
      <div class="page-header" data-testid="page-two-view">
        <a data-testid="link-back-home" href="/">Back to Home</a>
        <h1>Page Two</h1>
        <p class="page-header__subtitle">A second route in the standalone Web SDK reference.</p>
      </div>
      <div data-utilities></div>
      <div class="sections-grid sections-grid--split" data-testid="page-two-experiences">
        <section class="page-section">
          <header class="page-section__header"><h2>Automatically tracked Experiences</h2></header>
          <div class="entry-grid" id="page-two-auto-grid">
            <p class="placeholder-card">Experience content is not connected yet.</p>
          </div>
        </section>
        <section class="page-section">
          <header class="page-section__header"><h2>Manual events</h2></header>
          <div class="entry-grid" id="page-two-manual-grid">
            <p class="placeholder-card">Manual event examples are not connected yet.</p>
          </div>
        </section>
      </div>
    </template>

    <noscript>This application requires JavaScript for navigation.</noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
